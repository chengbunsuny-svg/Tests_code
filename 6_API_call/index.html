<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fetch function</title>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="font-mono">
    <div class="grid gap-4 p-4 grid-cols-3">
        <form action="" id="student-form" class="col-span-1 p-4 shadow-sm bg-white">
            <fieldset class="fieldset">
                <label class="label" for="name">Name</label>
                <input type="text" name="name" class="input w-full" placeholder="Name" />
            </fieldset>
            <fieldset class="fieldset">
                <label class="label" for="age">Age</label>
                <input type="text" name="age" class="input w-full" placeholder="Age" />
            </fieldset>
            <button class="btn btn-primary">Save</button>
        </form>
        <div class="overflow-x-auto col-span-2 shadow-sm bg-white">
            <table class="table">
                <!-- head -->
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Created At</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="data">
                </tbody>
            </table>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
