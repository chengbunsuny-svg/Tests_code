<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>
<body id="color_style",id = "bgColor_style">
    <input type="color" id="text-color">


  <div class="control-container">
    <div class="text">
      <button id="bold">B</button>
      <button id="italic">I</button>
      <button id="underline">U</button>
    </div>

    <div class="font">
      <button id="small">S</button>
      <button id="medium">M</button>
      <button id="large">L</button>
      <button id="x-large">XL</button>
    </div>


    <div class="family">
      <button id="monospace">MONOSPACE</button>
      <button id="cursive">CURSIVE</button>
      <button id="fantasy">FANTASY</button>
    </div>

    <div class="align">
      <button id="left">LEFT</button>
      <button id="center">CENTER</button>
      <button id="right">RIGHT</button>
    </div>

    <div>
      <label>TEXT COLOR</label>
      <input type="color" id="textColor">
    </div>

    <div>
      <label>BG COLOR</label>
      <input type="color" id="bgColor">
    </div>
    

  </div>


  <p id="sampleText">SAMPLE TEXT...</p>
  <script src="script.js"></script>
</body>
</html>
